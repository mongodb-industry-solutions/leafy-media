worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for text-based files
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 8080;
        server_name _;

        # Static files from templates (matches Ben's original structure)
        location /css/ {
            alias /app/templates/css/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /js/ {
            alias /app/templates/js/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /img/ {
            alias /app/templates/img/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /fontawesome/ {
            alias /app/templates/fontawesome/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Content files from Persistent Volume (/app/content)
        location /content/ {
            alias /app/content/;
            expires 1d;
            add_header Cache-Control "public";
        }

        # Default cover video from templates folder
        location = /video/cover.mp4 {
            alias /app/templates/video/cover.mp4;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Proxy all other requests to Flask/gunicorn sidecar
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for slow requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Health check endpoint (proxy to Flask)
        location /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
        }
    }
}
