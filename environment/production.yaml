# Kanopy Environment Configuration - Production
# Leafy Media - nginx + Flask sidecar deployment

# Main container (nginx) - no env vars needed

# Persistent Volume for content storage (images, audio, video)
# Used by both nginx (read) and Flask sidecar (read/write)
persistence:
  enabled: true
  name: leafy-media-content-prod
  size: 10Gi
  mountPath: /app/content
  accessMode: ReadWriteOnce

# Flask sidecar container
sidecarContainers:
  - name: flask
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-media-flask-prod:latest
    ports:
      - containerPort: 8000
        name: flask
    # Flask sidecar environment variables
    env:
      - name: FLASK_CONFIG
        value: production
      - name: FLASK_ENV
        value: production
      - name: MAIN_BASE_URL
        value: http://localhost:8080
      - name: API_BASE_URL
        value: http://localhost:8080/api
      - name: CONTENT_DIR
        value: /app/content
      # MongoDB connections
      - name: MONGODB_IST_MEDIA
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: MONGODB_IST_MEDIA
      - name: MONGODB_IST_MEDIA_PREVIEW
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: MONGODB_IST_MEDIA_PREVIEW
      # MongoDB database name
      - name: MONGODB_DB_NAME
        value: "1_media_demo"
      # Scheduled content jobs (enabled by default in production)
      - name: ENABLE_CONTENT_JOBS
        value: "true"
      # OpenAI / Azure OpenAI
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: OPENAI_API_KEY
      - name: AZURE_OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: AZURE_OPENAI_API_KEY
      - name: AZURE_OPENAI_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: AZURE_OPENAI_ENDPOINT
      # xAI API
      - name: XAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: XAI_API_KEY
      # Voyage AI (for embeddings)
      - name: VOYAGE_API_KEY
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: VOYAGE_API_KEY
      # News API
      - name: NEWS_API_URL
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: NEWS_API_URL
      - name: NEWS_API_KEY
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: NEWS_API_KEY
      # Auto Content API (for podcasts)
      - name: AUTOCONTENT_API_KEY
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: AUTOCONTENT_API_KEY
      # Basic Auth credentials
      - name: LEAFY_MEDIA_AUTH_USERNAME
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: LEAFY_MEDIA_AUTH_USERNAME
      - name: LEAFY_MEDIA_AUTH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: leafy-media
            key: LEAFY_MEDIA_AUTH_PASSWORD
    # Mount the same PV for content access
    volumeMounts:
      - name: leafy-media-content-prod
        mountPath: /app/content
    # Resources for Flask sidecar (production - more resources)
    resources:
      limits:
        cpu: 1000m
        memory: 2048Mi
      requests:
        cpu: 250m
        memory: 512Mi

security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: "benjamin.lorenze@mongodb.com"
