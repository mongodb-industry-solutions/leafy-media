# Kanopy Environment Configuration - Production
# Leafy Media Flask Application

env:
  FLASK_CONFIG: production
  FLASK_ENV: production

  # Base URLs (localhost for internal self-calls)
  MAIN_BASE_URL: http://localhost:8080
  API_BASE_URL: http://localhost:8080/api

  # Content directory (local path in container)
  CONTENT_DIR: /app/content

# Secrets - reference Kubernetes secrets created via helm ksec
envSecrets:
  # MongoDB connections
  MONGODB_LEAFY_MEDIA: leafy-media-prod
  MONGODB_LEAFY_MEDIA_PREVIEW: leafy-media-prod

  # OpenAI / Azure OpenAI
  OPENAI_API_KEY: leafy-media-prod
  AZURE_OPENAI_API_KEY: leafy-media-prod
  AZURE_OPENAI_ENDPOINT: leafy-media-prod

  # xAI API
  XAI_API_KEY: leafy-media-prod

  # Voyage AI (for embeddings)
  VOYAGE_API_KEY: leafy-media-prod

  # News API
  NEWS_API_URL: leafy-media-prod
  NEWS_API_KEY: leafy-media-prod

  # Auto Content API (for podcasts)
  AUTOCONTENT_API_KEY: leafy-media-prod

  # Basic Auth credentials
  LEAFY_MEDIA_AUTH_USERNAME: leafy-media-prod
  LEAFY_MEDIA_AUTH_PASSWORD: leafy-media-prod

# Persistent Volume for content storage (images, audio, video)
# Uses RWO (Read-Write-Once) - default EBS storage, no support ticket needed
persistence:
  enabled: true
  name: leafy-media-content-prod
  size: 10Gi
  mountPath: /app/content
  # No storageClass needed - uses default RWO (EBS)

# Liveness/Readiness probes
probes:
  enabled: true
  path: /health
  liveness:
    httpGet: true
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
